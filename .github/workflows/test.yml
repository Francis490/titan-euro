name: Test Fase 1

on: [push, workflow_dispatch]

jobs:
  test-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui fetch reale Eurojackpot
        run: python run_fetch.py

      - name: Esegui Backfill Storico
        run: python backfill.py

      - name: Mostra i dati estratti dal DB
        run: sqlite3 titan_euro.db "SELECT draw_date, num_1, num_2, num_3, num_4, num_5, euro_1, euro_2 FROM draws ORDER BY draw_date DESC;"

name: Test Fase 1 e 2

on: [push, workflow_dispatch]

jobs:
  test-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui fetch reale Eurojackpot
        run: python run_fetch.py

      - name: Esegui Backfill Storico
        run: python backfill.py

      - name: Genera Sestina Anti-Crowd Divina
        run: python anti_crowd.py

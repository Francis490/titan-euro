name: Titan Euro Automazione

on:
  schedule:
    - cron: '0 8 * * 3,6'
  workflow_dispatch:

jobs:
  update-and-play:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Ripristina Database SQLite
        uses: actions/cache@v3
        with:
          path: titan_euro.db
          key: titan-euro-db-${{ github.run_id }}
          restore-keys: |
            titan-euro-db-

      - name: Esegui Fetch (Scarica ultima estrazione)
        run: python run_fetch.py

      # NUOVO STEP: Ingoia lo storico dal CSV
      - name: Esegui Backfill Massivo CSV
        run: python backfill_csv.py

      - name: Salva Database SQLite
        uses: actions/cache@v3
        with:
          path: titan_euro.db
          key: titan-euro-db-${{ github.run_id }}

      - name: Genera Sestina Anti-Crowd (Log)
        run: python anti_crowd.py

      - name: Invia Sestina su Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_notifier.py
